<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>keel — step away</title>
    <style>
      /* Two phases, one window. The wheel is a brief, coloured moment of
         choosing; what follows is the calm dark screen that is the actual
         mechanism. The colour belongs to the first and must not outlast it. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #07080a;
        color: #e8e4dc;
        font: 400 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── the wheel ─────────────────────────────────────────── */
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: grab;
        transition: opacity 0.7s ease, transform 0.7s ease;
      }
      #stage.throwing {
        cursor: grabbing;
      }
      #stage.gone {
        opacity: 0;
        transform: scale(0.92);
        pointer-events: none;
      }
      #wheel {
        width: min(64vh, 64vw);
        height: min(64vh, 64vw);
        display: block;
        overflow: visible;
      }
      #pointer {
        margin-bottom: -1.1rem;
        font-size: 1.1rem;
        line-height: 1;
        color: #e8e4dc;
        opacity: 0.85;
        z-index: 2;
      }
      .seg-name {
        font-size: 13px;
        font-weight: 500;
        fill: #0b0c0e;
        opacity: 0.82;
      }
      .seg-emoji {
        font-size: 26px;
      }
      #grab-hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 3.2rem;
        text-align: center;
        font-size: 0.85rem;
        color: #4d4941;
        transition: opacity 0.5s ease;
      }

      /* ── the settled screen ────────────────────────────────── */
      /* The area's colour, as a trace rather than a field. The screen going
         dark is the mechanism; flooding it with a saturated hue would put back
         the stimulus we just removed. */
      #tint {
        position: fixed;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          58% 48% at 50% 44%,
          var(--tint, transparent) 0%,
          transparent 72%
        );
        pointer-events: none;
      }
      body.settled #tint {
        animation: bloom 2.4s ease forwards;
      }
      @keyframes bloom {
        to {
          opacity: 0.1;
        }
      }
      .card {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
        opacity: 0;
        transition: opacity 1.1s ease;
      }
      body.settled {
        cursor: none;
      }
      body.settled .card {
        opacity: 1;
      }
      .emoji {
        font-size: 4.5rem;
        line-height: 1;
        margin-bottom: 1.75rem;
      }
      .name {
        margin: 0 0 1rem;
        font-size: 2.25rem;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .note {
        margin: 0;
        font-size: 0.95rem;
        color: #6f6a62;
        min-height: 1.6em;
      }
      .empty .name {
        font-size: 1.5rem;
        font-weight: 400;
        color: #6f6a62;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8d877d;
      }
      /* Naming the way to ask is not the same as answering. The clock stays on
         request; what is always visible is only that asking is possible. */
      #hint {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 1.75rem;
        text-align: center;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        color: #2f2c27;
        opacity: 0;
        transition: opacity 0.9s ease;
      }
      body.settled #hint {
        opacity: 1;
      }
      #clock {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 3rem;
        text-align: center;
        font: 400 0.95rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #4d4941;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #clock.shown {
        opacity: 1;
      }
      /* The unlock path. Never offered up front — you have to reach for it. */
      #exit {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #07080a;
        cursor: auto;
        z-index: 5;
      }
      #exit.shown {
        display: flex;
      }
      #exit p {
        margin: 0 0 1.5rem;
        font-size: 1.25rem;
        color: #b8b2a8;
      }
      #intention {
        width: min(28rem, 70vw);
        padding: 0.75rem 0;
        border: none;
        border-bottom: 1px solid #2a2c30;
        background: transparent;
        color: #e8e4dc;
        font: inherit;
        font-size: 1.25rem;
        text-align: center;
        outline: none;
      }
      #intention::placeholder {
        color: #3a3730;
      }
      #exit .hint {
        margin: 1.5rem 0 0;
        font-size: 0.85rem;
        color: #4d4941;
      }
      @media (prefers-reduced-motion: reduce) {
        #stage,
        #tint,
        .card,
        #hint {
          transition: none;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="tint"></div>

    <div id="stage">
      <div id="pointer">▼</div>
      <svg id="wheel" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
    </div>
    <div id="grab-hint">drag to spin</div>

    <div class="card" id="card"></div>
    <div id="clock"></div>
    <div id="hint">any key · time left &nbsp; esc · go back</div>

    <!-- unlock_with_intention: the required way out. Naming what you are going
         back to is the friction — it hands the moment from System 1 to System 2
         and recruits values, rather than pretending there is no exit. -->
    <div id="exit">
      <p id="prompt"></p>
      <input
        id="intention"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="…"
      />
      <p class="hint">enter to go back · esc to stay</p>
    </div>

    <script>
      var gap = window.__STEP_AWAY__ || {};
      var options = (gap.wheel && gap.wheel.options) || [];
      var startAt = (gap.wheel && gap.wheel.startAt) || 0;

      var stage = document.getElementById("stage");
      var svg = document.getElementById("wheel");
      var grabHint = document.getElementById("grab-hint");
      var card = document.getElementById("card");
      var clock = document.getElementById("clock");
      var exit = document.getElementById("exit");
      var intention = document.getElementById("intention");
      document.getElementById("prompt").textContent =
        gap.prompt || "what are you going back to?";

      var HEX = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
      var NS = "http://www.w3.org/2000/svg";
      var drawn = null; // the landed option, once the wheel stops
      var startedAt = 0; // when the hold began — i.e. when it landed

      function el(tag, attrs) {
        var node = document.createElementNS(NS, tag);
        for (var k in attrs) {
          node.setAttribute(k, attrs[k]);
        }
        return node;
      }
      function safeColor(value, fallback) {
        return value && HEX.test(value) ? value : fallback;
      }

      // ── drawing the wheel ──────────────────────────────────────
      var R = 100;
      var step = options.length ? 360 / options.length : 360;

      function buildWheel() {
        var group = el("g", { id: "spin" });
        for (var i = 0; i < options.length; i++) {
          var a0 = (i * step - 90) * (Math.PI / 180);
          var a1 = ((i + 1) * step - 90) * (Math.PI / 180);
          var large = step > 180 ? 1 : 0;
          var d =
            "M 0 0 L " +
            R * Math.cos(a0) +
            " " +
            R * Math.sin(a0) +
            " A " +
            R +
            " " +
            R +
            " 0 " +
            large +
            " 1 " +
            R * Math.cos(a1) +
            " " +
            R * Math.sin(a1) +
            " Z";
          group.appendChild(
            el("path", {
              d: d,
              fill: safeColor(options[i].tint, "#3f3a33"),
              stroke: "#07080a",
              "stroke-width": "1.5",
            })
          );

          // Labels sit upright along the segment's midline.
          var mid = (i + 0.5) * step - 90;
          var rad = mid * (Math.PI / 180);
          if (options[i].emoji) {
            var e = el("text", {
              x: R * 0.58 * Math.cos(rad),
              y: R * 0.58 * Math.sin(rad),
              "text-anchor": "middle",
              "dominant-baseline": "central",
              class: "seg-emoji",
            });
            e.textContent = options[i].emoji;
            group.appendChild(e);
          }
          var label = el("text", {
            x: R * 0.86 * Math.cos(rad),
            y: R * 0.86 * Math.sin(rad),
            "text-anchor": "middle",
            "dominant-baseline": "central",
            class: "seg-name",
            transform:
              "rotate(" +
              (mid + 90) +
              " " +
              R * 0.86 * Math.cos(rad) +
              " " +
              R * 0.86 * Math.sin(rad) +
              ")",
          });
          label.textContent = options[i].habit;
          group.appendChild(label);
        }
        group.appendChild(el("circle", { r: 7, fill: "#07080a" }));
        svg.appendChild(group);
      }

      // ── the throw ──────────────────────────────────────────────
      var rotation = startAt * step * -1; // rest on a different face each time
      var velocity = 0; // degrees per ms
      var dragging = false;
      var lastAngle = 0;
      var lastMove = 0;
      var raf = null;
      var idleThrow = null;

      function applyRotation() {
        var g = document.getElementById("spin");
        if (g) {
          g.setAttribute("transform", "rotate(" + rotation + ")");
        }
      }

      /** Which segment sits under the pointer at 12 o'clock. */
      function landedIndex() {
        var at = ((-rotation % 360) + 360) % 360;
        return Math.floor(at / step) % options.length;
      }

      function pointerAngle(event) {
        var box = svg.getBoundingClientRect();
        var cx = box.left + box.width / 2;
        var cy = box.top + box.height / 2;
        return (
          Math.atan2(event.clientY - cy, event.clientX - cx) * (180 / Math.PI)
        );
      }

      function armWheel() {
        applyRotation();
        // If it is never touched, it throws itself — the tool should not
        // require ceremony from someone who just wants to step away.
        idleThrow = setTimeout(function () {
          velocity = 0.55 + Math.random() * 0.5;
          spinDown();
        }, 6000);
      }

      function cancelIdleThrow() {
        if (idleThrow) {
          clearTimeout(idleThrow);
          idleThrow = null;
        }
      }

      document.addEventListener("mousedown", function (event) {
        if (drawn || exit.classList.contains("shown") || !options.length) return;
        cancelIdleThrow();
        if (raf) {
          cancelAnimationFrame(raf);
          raf = null;
        }
        dragging = true;
        velocity = 0;
        lastAngle = pointerAngle(event);
        lastMove = Date.now();
        stage.classList.add("throwing");
      });

      document.addEventListener("mousemove", function (event) {
        if (!dragging) return;
        var angle = pointerAngle(event);
        var delta = angle - lastAngle;
        // Shortest way round, so crossing the 180° seam does not fling it.
        while (delta > 180) delta -= 360;
        while (delta < -180) delta += 360;
        var now = Date.now();
        var dt = Math.max(1, now - lastMove);
        rotation += delta;
        velocity = delta / dt;
        lastAngle = angle;
        lastMove = now;
        applyRotation();
      });

      document.addEventListener("mouseup", function () {
        if (!dragging) return;
        dragging = false;
        stage.classList.remove("throwing");
        // Stale grip: let go without moving and it simply stays put.
        if (Date.now() - lastMove > 120) velocity = 0;
        spinDown();
      });

      /**
       * Friction only — the wheel loses speed and stops wherever it stops.
       * Nothing steers it toward a chosen segment: a wheel you throw that
       * lands where the machine already decided is a rigged wheel, and a
       * fake agency affordance is worse than no wheel at all.
       */
      function spinDown() {
        var last = Date.now();
        function frame() {
          var now = Date.now();
          var dt = Math.min(48, now - last);
          last = now;
          rotation += velocity * dt;
          velocity *= Math.pow(0.9915, dt);
          applyRotation();
          if (Math.abs(velocity) > 0.012) {
            raf = requestAnimationFrame(frame);
          } else {
            raf = null;
            land();
          }
        }
        raf = requestAnimationFrame(frame);
      }

      function land() {
        if (drawn) return;
        drawn = options[landedIndex()];
        startedAt = Date.now();

        // Report where the throw ended up. The outcome is the hand's, so it
        // travels inward to be logged — the tray never pre-chose it.
        try {
          window.__TAURI__.event.emit(
            gap.drawnEvent || "step-away://drawn",
            landedIndex()
          );
        } catch (err) {
          // Fail-open: the screen still dims, the gap just goes unlogged.
        }

        if (drawn.tint && HEX.test(drawn.tint)) {
          document.documentElement.style.setProperty("--tint", drawn.tint);
        }

        // The colour was for choosing. What remains is the dark screen.
        setTimeout(function () {
          stage.classList.add("gone");
          grabHint.style.opacity = 0;
          if (drawn.emoji) {
            var e = document.createElement("div");
            e.className = "emoji";
            e.textContent = drawn.emoji;
            card.appendChild(e);
          }
          var n = document.createElement("p");
          n.className = "name";
          n.textContent = drawn.habit;
          card.appendChild(n);
          var note = document.createElement("p");
          note.className = "note";
          note.textContent = drawn.offScreen
            ? "the screen will wait."
            : "on the screen — this closes in a moment.";
          card.appendChild(note);
          document.body.classList.add("settled");
        }, 650);
      }

      // ── the hold, once something has been drawn ────────────────
      function holdMs() {
        if (!drawn) return 0;
        // Mirrors domain::GapHabit::hold_ms — off-screen waits the habit's own
        // size (capped), on-screen only long enough to read the name.
        if (!drawn.offScreen) return 5000;
        if (!drawn.expectedMin) return 60000;
        return Math.min(drawn.expectedMin * 60000, 15 * 60000);
      }
      function remainingMs() {
        if (!startedAt) return 0;
        return Math.max(0, holdMs() - (Date.now() - startedAt));
      }
      function label(ms) {
        var total = Math.ceil(ms / 1000);
        var secs = total % 60;
        return Math.floor(total / 60) + ":" + (secs < 10 ? "0" : "") + secs;
      }

      var hideClock;
      function revealRemaining() {
        if (!drawn) return;
        var left = remainingMs();
        clock.textContent = left > 0 ? label(left) + " left" : "the hold is done";
        clock.classList.add("shown");
        clearTimeout(hideClock);
        hideClock = setTimeout(function () {
          clock.classList.remove("shown");
        }, 2500);
      }

      function release() {
        // Closing the window IS the release; the tray sees it and closes the span.
        try {
          window.__TAURI__.window.getCurrentWindow().close();
        } catch (err) {
          // Fail-open: the tray's "Return" still works once the hold is up.
        }
      }

      document.addEventListener("keydown", function (event) {
        if (exit.classList.contains("shown")) {
          if (event.key === "Escape") {
            exit.classList.remove("shown");
            intention.value = "";
          } else if (event.key === "Enter" && intention.value.trim()) {
            // The intention is never logged — it does its work in the typing.
            release();
          }
          return;
        }
        // Before anything is drawn there is no gap to leave: Esc just closes,
        // and nothing is logged, because spinning is not stepping away.
        if (!drawn) {
          if (event.key === "Escape") release();
          return;
        }
        if (event.key === "Escape") {
          exit.classList.add("shown");
          intention.focus();
          return;
        }
        revealRemaining();
      });

      document.addEventListener("click", function () {
        if (drawn) revealRemaining();
      });

      // ── start ──────────────────────────────────────────────────
      // Last, so every declaration above it has actually been assigned.
      if (!options.length) {
        stage.classList.add("gone");
        grabHint.style.opacity = 0;
        card.className = "card empty";
        var n0 = document.createElement("p");
        n0.className = "name";
        n0.textContent = "nothing on the wheel";
        card.appendChild(n0);
        var h0 = document.createElement("p");
        h0.className = "note";
        h0.appendChild(document.createTextNode("tag a zenborg habit "));
        var c0 = document.createElement("code");
        c0.textContent = "gap";
        h0.appendChild(c0);
        h0.appendChild(document.createTextNode(" to fill it."));
        card.appendChild(h0);
        document.body.classList.add("settled");
      } else {
        buildWheel();
        armWheel();
      }
</script>
  </body>
</html>
