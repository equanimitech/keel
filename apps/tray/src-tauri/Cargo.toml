[package]
name = "keel-tray"
version = "0.1.0"
description = "keel tray — menubar-only desktop attention logger"
authors = ["Rafa Ballestiero"]
edition = "2021"

[lib]
name = "keel_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
x-win = "5.3.3"
user-idle = "0.6"
tauri-plugin-single-instance = "2.4.2"
