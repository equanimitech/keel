<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>keel — manage</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="manage-page">
      <header>
        <h1>keel</h1>
        <p class="subtitle">Observability — your log, your watchlist, your machine</p>
      </header>

      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="watchlist">Watchlist</button>
        <button class="tab-btn" data-tab="blocklist">Blocklist</button>
      </nav>

      <div id="tab-watchlist" class="tab-content active">
        <div id="watchlist-panel"></div>
      </div>

      <div id="tab-blocklist" class="tab-content">
        <div id="blocklist-panel"></div>
      </div>

      <footer class="log-export">
        <button id="export-log-btn" class="log-export-btn" type="button">
          Export keel log (JSONL)
        </button>
        <span id="export-log-status" class="log-export-status"></span>
      </footer>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
